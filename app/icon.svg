<!-- Mirrors the mark in components/spark.tsx. Needles are slightly wider here so
     they hold up at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#1e4d43" />
  <g fill="#f6f3ee">
    <polygon points="16,3.6 14.1,14.4 17.9,14.4" />
    <polygon points="16,3.6 14.1,14.4 17.9,14.4" transform="rotate(90 16 16)" />
    <polygon points="16,3.6 14.1,14.4 17.9,14.4" transform="rotate(180 16 16)" />
    <polygon points="16,3.6 14.1,14.4 17.9,14.4" transform="rotate(270 16 16)" />
    <polygon points="16,8.8 14.5,14.6 17.5,14.6" transform="rotate(45 16 16)" />
    <polygon points="16,8.8 14.5,14.6 17.5,14.6" transform="rotate(135 16 16)" />
    <polygon points="16,8.8 14.5,14.6 17.5,14.6" transform="rotate(225 16 16)" />
    <polygon points="16,8.8 14.5,14.6 17.5,14.6" transform="rotate(315 16 16)" />
    <circle cx="16" cy="16" r="1.9" />
  </g>
</svg>
